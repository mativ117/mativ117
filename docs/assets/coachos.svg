<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460"><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#203644"/><stop offset="1" stop-color="#111f2b"/></linearGradient><pattern id="grid" width="29.3333" height="29.3333" patternUnits="userSpaceOnUse"><path d="M0 29.3333V0h29.3333" fill="none" stroke="#c5d8df" stroke-opacity=".025"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#e4b87d" stroke-width="1.3"/></marker></defs>
<rect width="720" height="460" fill="url(#b)"/><rect width="720" height="460" fill="url(#grid)"/>
<!-- Demi-terrain FIBA : 15 m de large et 14 m de long, échelle 26 px/m.
     Baseline y=28, milieu y=392 ; panier x=360, y=68.95 (1,575 m).
     Trois points : rayon 6,75 m, segments à 0,90 m des lignes latérales. -->
<g fill="none" stroke="#a8c0c4" stroke-opacity=".6" stroke-width="1.5" stroke-linejoin="round">
<rect x="165" y="28" width="390" height="364" rx="0" fill="#1c303c"/>
<!-- Raquette 4,90 m x 5,80 m ; cercle des lancers rayon 1,80 m. -->
<rect x="296.3" y="28" width="127.4" height="150.8"/>
<path d="M313.2 178.8a46.8 46.8 0 0 0 93.6 0"/>
<path d="M313.2 178.8a46.8 46.8 0 0 1 93.6 0" stroke-dasharray="4 5" stroke-opacity=".35"/>
<!-- Trois points : cercle centré sur le panier, raccord exact aux coins. -->
<path d="M188.4 28V105.742526A175.5 175.5 0 0 0 531.6 105.742526V28"/>
<!-- Demi-cercle de non-charge : rayon 1,25 m. -->
<path d="M327.5 68.95a32.5 32.5 0 0 0 65 0" stroke-opacity=".4"/>
<!-- Cercle central, coupé par la ligne médiane. -->
<path d="M313.2 392a46.8 46.8 0 0 1 93.6 0"/>
<!-- Marques latérales des lancers francs. -->
<path d="M290 94h6.3m127.4 0h6.3M290 116h6.3m127.4 0h6.3M290 138h6.3m127.4 0h6.3"/>
</g>
<!-- Planche à 1,20 m de la ligne de fond ; anneau aligné sur l’axe central. -->
<g fill="none" stroke="#e0d3b9" stroke-width="2"><path d="M336.6 59.2h46.8M360 59.2v3.8"/><circle cx="360" cy="68.95" r="5.95"/></g>
<!-- Schéma tactique illustratif, distinct du marquage du terrain. -->
<g fill="none" stroke="#e4b87d" stroke-width="2" marker-end="url(#arrow)"><path d="M239 257Q244 208 277 160" stroke-dasharray="6 6"/><path d="M465 242Q420 236 405 211"/><path d="M288 152 444 243" stroke-dasharray="2 7"/></g>
<g fill="#e4b87d" stroke="#1c303c" stroke-width="5"><circle cx="234" cy="273" r="16"/><circle cx="285" cy="145" r="16"/><circle cx="470" cy="257" r="16"/></g>
<g fill="#182b35" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle"><text x="234" y="277">1</text><text x="285" y="149">2</text><text x="470" y="261">3</text></g>
<text x="360" y="433" fill="#a9bfc6" font-family="sans-serif" font-size="10" text-anchor="middle" letter-spacing="3">DESSINER · TRANSMETTRE · JOUER</text></svg>